<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ruflorust-wf-dark-title ruflorust-wf-dark-desc">
      <title id="ruflorust-wf-dark-title">ruflo-rust capability-gated dispatch</title>
      <desc id="ruflorust-wf-dark-desc">A CLI command or MCP tool call enters the dispatcher, which checks the capability manifest; a registered capability runs the real typed crate operation and returns a typed result, an unregistered one returns a deterministic tool.unsupported error with a non-zero exit, never a fake success.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9b0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff8552"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#1c1917"/>

      <line x1="128" y1="112" x2="168" y2="112" stroke="#a9b0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="328" y1="112" x2="368" y2="112" stroke="#a9b0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="488" y1="112" x2="528" y2="112" stroke="#ff8552" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="688" y1="112" x2="728" y2="112" stroke="#ff8552" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="428" y1="172" x2="428" y2="252" stroke="#a9b0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="492" y="96" width="32" height="12" rx="2" fill="#1c1917"/>
      <text x="508" y="105" fill="#ff8552" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
      <rect x="412" y="204" width="28" height="12" rx="2" fill="#1c1917"/>
      <text x="426" y="213" fill="#a9b0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="0" y="88" width="128" height="48" rx="6" fill="rgba(169,176,192,0.14)" stroke="#9099ad" stroke-width="1"/>
      <text x="64" y="108" fill="#faf7f2" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLI or MCP call</text>
      <text x="64" y="122" fill="#a9b0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ruflo-cli / ruflo-mcp</text>

      <rect x="168" y="88" width="160" height="48" rx="6" fill="#ffffff" stroke="#faf7f2" stroke-width="1"/>
      <text x="248" y="108" fill="#faf7f2" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dispatcher</text>
      <text x="248" y="122" fill="#a9b0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ruflo-mcp / ruflo-runtime</text>

      <polygon points="428,64 488,112 428,160 368,112" fill="#ffffff" stroke="#faf7f2" stroke-width="1"/>
      <text x="428" y="108" fill="#faf7f2" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Capability</text>
      <text x="428" y="121" fill="#faf7f2" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">registered?</text>

      <rect x="528" y="88" width="160" height="48" rx="6" fill="rgba(255,133,82,0.14)" stroke="#ff8552" stroke-width="1"/>
      <text x="608" y="108" fill="#faf7f2" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Typed crate op</text>
      <text x="608" y="122" fill="#a9b0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ruflo-core</text>

      <rect x="728" y="88" width="160" height="48" rx="24" fill="rgba(250,247,242,0.05)" stroke="rgba(250,247,242,0.32)" stroke-width="1"/>
      <text x="808" y="108" fill="#faf7f2" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Typed result</text>
      <text x="808" y="122" fill="#a9b0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exit 0</text>

      <rect x="348" y="252" width="160" height="48" rx="24" fill="rgba(45,49,66,0.02)" stroke="rgba(250,247,242,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="428" y="272" fill="#faf7f2" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tool.unsupported</text>
      <text x="428" y="286" fill="#a9b0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deterministic, exit != 0</text>

      <line x1="0" y1="332" x2="1000" y2="332" stroke="rgba(250,247,242,0.12)" stroke-width="0.8"/>
      <text x="0" y="348" fill="#a9b0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="100" y1="344" x2="128" y2="344" stroke="#ff8552" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="136" y="348" fill="#a9b0c0" font-size="8.5" font-family="'Geist', sans-serif">Implemented path</text>
      <line x1="300" y1="344" x2="328" y2="344" stroke="#a9b0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="336" y="348" fill="#a9b0c0" font-size="8.5" font-family="'Geist', sans-serif">Dispatch / guard</text>
      <rect x="500" y="338" width="24" height="12" rx="24" fill="rgba(45,49,66,0.02)" stroke="rgba(250,247,242,0.22)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="532" y="348" fill="#a9b0c0" font-size="8.5" font-family="'Geist', sans-serif">Deterministic error, never faked</text>
    </svg>