<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ruflo-rust — workspace architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
    --color-accent: #eb6c36;
    --font-sans: 'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }
  body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
  h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
    letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · ruflo-rust</p>
    <h1>One workspace, three layers: shared types, deterministic core, typed boundaries</h1>

    <svg viewBox="0 0 1160 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ruflorust-arch-light-title ruflorust-arch-light-desc">
      <title id="ruflorust-arch-light-title">ruflo-rust workspace architecture</title>
      <desc id="ruflorust-arch-light-desc">Eleven Cargo workspace crates in three layers: shared foundation crates (types, config), deterministic core services (core, storage, memory), and typed consumer boundaries (CLI, MCP, actions, an optional Node addon), all publish=false and reused only from this workspace or a local path dependency.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="0" y="32" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01 · FOUNDATION</text>
      <line x1="0" y1="44" x2="1160" y2="44" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <text x="0" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02 · DETERMINISTIC CORE</text>
      <line x1="0" y1="164" x2="1160" y2="164" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <text x="0" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">03 · TYPED BOUNDARIES</text>
      <line x1="0" y1="312" x2="1160" y2="312" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <line x1="160" y1="104" x2="160" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="104" x2="400" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="256" x2="160" y2="328" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="400" y1="256" x2="400" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="256" x2="640" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="0" y="60" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="80" y="87" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ruflo-types</text>
      <rect x="240" y="60" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ruflo-config</text>
      <text x="320" y="94" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">capability manifest</text>

      <rect x="0" y="180" width="160" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="80" y="208" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ruflo-core</text>
      <text x="80" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">embed / similarity /</text>
      <text x="80" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">routing — no I/O</text>

      <rect x="240" y="180" width="160" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="208" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ruflo-storage</text>
      <text x="320" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite + RVF</text>
      <text x="320" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">adapter</text>

      <rect x="480" y="180" width="160" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="208" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ruflo-memory</text>
      <text x="560" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">semantic facade,</text>
      <text x="560" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hybrid retrieval</text>

      <rect x="720" y="180" width="170" height="76" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="805" y="208" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ruflo-napi</text>
      <text x="805" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">optional Node</text>
      <text x="805" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">addon</text>

      <rect x="0" y="328" width="160" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="80" y="350" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ruflo-cli</text>
      <text x="80" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">reference CLI</text>

      <rect x="240" y="328" width="160" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="320" y="350" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ruflo-mcp</text>
      <text x="320" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">typed MCP boundary</text>

      <rect x="480" y="328" width="160" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="560" y="350" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ruflo-actions</text>
      <text x="560" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">tool call surface</text>

      <rect x="0" y="416" width="1160" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
      <text x="20" y="440" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif">Every crate is publish = false</text>
      <text x="20" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">reused from this workspace, or a fork / local path dependency — no stable crates.io API or npm distribution assumed</text>

      <line x1="0" y1="500" x2="1160" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="0" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="80" y1="512" x2="108" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="116" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Depends on</text>
      <rect x="240" y="506" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="272" y="516" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">No-I/O deterministic core</text>
    </svg>
  </div>
</body>
</html>
