# Default cloud appliance profile. Packed into the image and RVFA host section.
profile: cloud
supervisor:
  command: ["ruflo", "daemon", "start", "--foreground", "--ttl", "0"]
  workers: [map, audit, optimize, consolidate, testgaps]
store: sqlite
spend: fail-closed
mcp:
  tools: [agent_spawn, memory_store, memory_retrieve, memory_search]
