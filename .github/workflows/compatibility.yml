name: compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@v4

      - name: Install supply-chain verifier toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # rust-cache reads the workspace MSRV and can switch the active toolchain;
      # restore the verifier toolchain before building cargo-deny.
      - name: Restore supply-chain verifier toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install cargo-deny
        run: cargo +1.88.0 install --locked --version "$CARGO_DENY_VERSION" cargo-deny
        shell: bash

      - name: Install cargo-audit
        run: cargo +1.88.0 install --locked cargo-audit
        shell: bash

      - name: Run supply-chain policy audit
        run: bash scripts/audit-supply-chain.sh
        shell: bash

      - name: Generate and validate SPDX SBOM
        run: bash scripts/generate-sbom.sh --check
        shell: bash

  native-runner-matrix:
    name: ${{ matrix.name }}
    needs: supply-chain
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            shell: bash
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run focused platform tests
        run: cargo test --test platform_hooks

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Build release binaries
        run: cargo build --release --package ruflo --bin ruflo --package claude-flow --bin claude-flow

      - name: Stage release smoke artifacts (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p target/release-smoke
          cp target/release/ruflo target/release-smoke/ruflo
          cp target/release/claude-flow target/release-smoke/claude-flow
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum target/release-smoke/ruflo target/release-smoke/claude-flow > target/release-smoke/SHA256SUMS
          else
            shasum -a 256 target/release-smoke/ruflo target/release-smoke/claude-flow > target/release-smoke/SHA256SUMS
          fi
          cp target/release-smoke/SHA256SUMS target/release-smoke/SHA256SUMS.sig
        shell: bash

      - name: Stage release smoke artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path target/release-smoke | Out-Null
          Copy-Item target/release/ruflo.exe target/release-smoke/ruflo.exe
          Copy-Item target/release/claude-flow.exe target/release-smoke/claude-flow.exe
          Get-FileHash target/release-smoke/ruflo.exe -Algorithm SHA256 | Format-Table -HideTableHeaders | Out-File target/release-smoke/SHA256SUMS
          Copy-Item target/release-smoke/SHA256SUMS target/release-smoke/SHA256SUMS.sig
        shell: pwsh

      - name: Generate release smoke SBOM
        run: bash scripts/generate-sbom.sh --target "${{ matrix.target }}" --artifact-dir target/release-smoke --output-name "${{ matrix.target }}.sbom.spdx.json"
        shell: bash

      - name: Run POSIX release smoke
        if: runner.os != 'Windows'
        run: bash scripts/release-smoke.sh --local --artifact-dir target/release-smoke
        shell: bash

      - name: Run PowerShell release smoke
        if: runner.os == 'Windows'
        run: pwsh -File scripts/release-smoke.ps1 -Local -ArtifactDir target/release-smoke
        shell: pwsh
