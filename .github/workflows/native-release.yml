name: native-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }
      - name: Test platform contract
        run: cargo test --test platform_hooks
      - name: Build both public aliases
        run: cargo build --release --target ${{ matrix.target }} -p ruflo -p claude-flow
      - name: Stage POSIX archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="ruflo-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/ruflo" "$stage/"
          cp "target/${{ matrix.target }}/release/claude-flow" "$stage/"
          shasum -a 256 "$stage"/* > "$stage/SHA256SUMS"
          tar -czf "$stage.tar.gz" "$stage"
      - name: Stage Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "ruflo-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $stage
          Copy-Item "target/${{ matrix.target }}/release/ruflo.exe" $stage
          Copy-Item "target/${{ matrix.target }}/release/claude-flow.exe" $stage
          Get-ChildItem $stage -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Name } | Set-Content "$stage/SHA256SUMS"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ruflo-${{ matrix.target }}
          path: ruflo-${{ matrix.target }}.${{ matrix.archive }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release asset set
        run: |
          test -f release-assets/ruflo-x86_64-unknown-linux-gnu.tar.gz
          test -f release-assets/ruflo-x86_64-apple-darwin.tar.gz
          test -f release-assets/ruflo-aarch64-apple-darwin.tar.gz
          test -f release-assets/ruflo-x86_64-pc-windows-msvc.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
