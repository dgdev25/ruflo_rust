[package]
name = "ruflo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ruflo"
path = "src/main.rs"

[features]
default = ["ast", "onnx"]
ast = ["ruflo-cli/ast"]
onnx = ["ruflo-cli/onnx"]

[dependencies]
ruflo-cli = { path = "../../crates/ruflo-cli", default-features = false }
