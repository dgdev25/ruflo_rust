[package]
name = "ruflo-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native Ruflo stdio MCP dispatcher with shared registry and policy enforcement."

[lib]
path = "src/lib.rs"

[features]
default = []
stateless-http = ["dep:axum", "dep:base64", "dep:hmac", "dep:sha2", "dep:tokio"]

[dependencies]
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
ruflo-config = { path = "../ruflo-config" }
ruflo-storage = { path = "../ruflo-storage" }
ruflo-types = { path = "../ruflo-types" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
