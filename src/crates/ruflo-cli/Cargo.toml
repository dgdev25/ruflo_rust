[package]
name = "ruflo-cli"
version = "3.34.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Shared native CLI dispatcher for the Ruflo and claude-flow wrappers."

[lib]
path = "src/lib.rs"

[features]
default = ["ast", "onnx"]
# Real AST analysis via tree-sitter (rust + typescript grammars). On by default
# so `analyze ast` uses a real parser, not the regex fallback. The grammars
# compile C and add ~30s to a clean build.
ast = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-typescript", "dep:tree-sitter-python", "dep:tree-sitter-go", "dep:tree-sitter-java", "dep:tree-sitter-c"]
# ONNX MiniLM embeddings via ort (real neural inference). On by default for the
# native host. Disabled for Windows GNU cross-compile because ort ships no
# prebuilt binaries for that target (build with --no-default-features there,
# or the windows-cross.yml CI path).
onnx = ["dep:ort", "dep:tokenizers"]
# ONNX via ort load-dynamic — loads onnxruntime.dll/.so at runtime instead of
# linking at build. Use this for Windows releases: build with
# --features onnx-dynamic --no-default-features and ship the ONNX Runtime DLL
# alongside ruflo.exe (the windows-release workflow does this).
onnx-dynamic = ["dep:ort", "dep:tokenizers", "ort/load-dynamic"]
# Localhost HTTP registry server (axum + tokio). Off by default; enable with
# --features registry-http to run `ruflo registry serve`.
registry-http = ["dep:axum", "dep:tokio"]

[dependencies]
axum = { workspace = true, optional = true }
ruflo-config = { path = "../ruflo-config" }
ruflo-codex-cli = { path = "../ruflo-codex-cli" }
ruflo-mcp = { path = "../ruflo-mcp" }
ruflo-memory = { path = "../ruflo-memory" }
ruflo-runtime = { path = "../ruflo-runtime" }
ruflo-storage = { path = "../ruflo-storage" }
ruflo-types = { path = "../ruflo-types" }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
petgraph = { workspace = true }
dialoguer = { workspace = true }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
