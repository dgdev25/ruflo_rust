[package]
name = "ruflo-cli"
version = "3.34.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Shared native CLI dispatcher for the Ruflo and claude-flow wrappers."

[lib]
path = "src/lib.rs"

[features]
default = []
# Real AST analysis via tree-sitter. Off by default — grammars compile C code
# and add ~30s to a clean build. Enable with --features ast.
ast = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-typescript"]

[dependencies]
ruflo-config = { path = "../ruflo-config" }
ruflo-codex-cli = { path = "../ruflo-codex-cli" }
ruflo-mcp = { path = "../ruflo-mcp" }
ruflo-runtime = { path = "../ruflo-runtime" }
ruflo-storage = { path = "../ruflo-storage" }
ruflo-types = { path = "../ruflo-types" }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
petgraph = { workspace = true }
dialoguer = { workspace = true }
ort = { workspace = true }
tokenizers = { workspace = true }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
