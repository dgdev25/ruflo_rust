[package]
name = "fixture-capture-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

# The root package exists to host cross-crate contract tests under `tests/`
# and the fixture-capture utility binary. Product source lives in the
# workspace member crates under `src/crates/`.
autobins = false
autoexamples = false
autobenches = false

[lib]
path = "src/root_harness.rs"

[workspace]
members = ["src/crates/*", "src/bin/ruflo", "src/bin/claude-flow"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dependencies]
ruflo-config = { path = "src/crates/ruflo-config" }
ruflo-mcp = { path = "src/crates/ruflo-mcp" }
ruflo-types = { path = "src/crates/ruflo-types" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
ruflo-config = { path = "src/crates/ruflo-config" }
ruflo-mcp = { path = "src/crates/ruflo-mcp" }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "fixture-capture"
path = "src/bin/fixture_capture.rs"
